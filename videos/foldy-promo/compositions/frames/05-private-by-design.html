    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const q = (name) => document.querySelector('[id="f05-private-by-design-' + name + '"]');

        const stack = q("stack");
        const line0 = q("line0");
        const line1 = q("line1");
        const line2 = q("line2");
        const glass = q("pill-glass");
        const label = q("pill-label");

        const TEXT = "#0d0e12";
        const MUTED = "#5d6270";
        const LIGHT = "#9a9a9a";
        const PITCH = 104;

        const tl = gsap.timeline({ paused: true });

        // Entry: a line rises into the centre, soft-focus resolving sharp (text-scale blur peak 10px).
        const rise = (el, at) =>
          tl.fromTo(
            el,
            { y: 84, opacity: 0, filter: "blur(10px)" },
            { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
            at,
          );

        // Lift: the whole column moves up one row; the new line enters while the lift is at speed,
        // so every line travels upward together across the seam (velocity-matched waterfall).
        const lift = (fromRow, at) =>
          tl.fromTo(
            stack,
            { y: -PITCH * fromRow },
            { y: -PITCH * (fromRow + 1), duration: 0.72, ease: "power2.inOut", immediateRender: false },
            at,
          );

        const dim = (el, from, to, at) =>
          tl.fromTo(el, { color: from }, { color: to, duration: 0.55, ease: "power1.inOut", immediateRender: false }, at);

        // ── Scene 1 (0.0–1.0s): ground with washes; "No account." rises into the centre.
        tl.set(stack, { y: 0 }, 0);
        rise(line0, 0.1);

        // ── Scene 2 (1.0–2.0s): "No account." lifts and dims to text-muted; "No license key." rises in.
        lift(0, 1.0);
        dim(line0, TEXT, MUTED, 1.05);
        rise(line1, 1.22);

        // ── Scene 3 (2.0–3.0s): same relay; the column settles newest-darkest.
        lift(1, 2.0);
        dim(line1, TEXT, MUTED, 2.05);
        dim(line0, MUTED, LIGHT, 2.05);
        rise(line2, 2.22);

        // ── Scene 4 (3.0–4.5s): glass pill scales open on X beneath the stack, label resolves, then still.
        tl.fromTo(
          glass,
          { scaleX: 0.04, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.6, ease: "expo.out" },
          3.0,
        );
        tl.fromTo(
          label,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" },
          3.2,
        );

        // Pad to the full frame length (the breather holds still to the cut).
        tl.set({}, {}, 4.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-private-by-design"] = tl;
      })();
