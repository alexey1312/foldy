# Tag a commit v1.2.3 and push the tag: this builds Foldy.app on a macOS runner,
# packs it as a zip and a DMG, and publishes both on a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# With the signing secrets set (see README › Signing), the app is signed with a
# Developer ID, notarized and stapled. Without them it is ad-hoc signed and macOS
# blocks the first launch: open it once, then System Settings › Privacy & Security ›
# Open Anyway, or: xattr -dr com.apple.quarantine /Applications/Foldy.app
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write   # to start the Pages deploy after the appcast commit

env:
  HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APP_STORE_CONNECT_KEY != '' }}
  HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
  SPARKLE_VERSION: 2.9.6

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version

      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Support/Info.plist

      - run: swift test

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "p12: $(stat -f %z "$RUNNER_TEMP/cert.p12") bytes, password $([ -n "$CERT_PASSWORD" ] && echo set || echo EMPTY)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple's intermediates, so the identity chains and counts as valid.
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign >/dev/null || true
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign >/dev/null || true
          if ! security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; then
            echo "::error::Could not import the .p12. A wrong MACOS_CERTIFICATE_PASSWORD gives 'MAC verification failed'; a broken MACOS_CERTIFICATE_P12 (not base64 of the .p12) gives 'Unable to import'."
            exit 1
          fi
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          if ! security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null; then
            echo "::error::The .p12 holds no private key. In Keychain Access open the disclosure triangle on 'Developer ID Application: …', select the certificate AND the key beneath it, and export both as one .p12."
            exit 1
          fi
          echo "Identities:"
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid 'Developer ID Application' identity after import. The certificate must be of type Developer ID Application (not Apple Development) and carry its private key."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign Foldy.app
        run: Scripts/bundle.sh release

      - name: Notarize and staple the app
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent build/Foldy.app "$RUNNER_TEMP/Foldy-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Foldy-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple build/Foldy.app
          spctl -a -vv -t exec build/Foldy.app

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          ditto -c -k --keepParent build/Foldy.app "dist/Foldy-$VERSION.zip"
          STAGE="$(mktemp -d)"
          cp -R build/Foldy.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Foldy -srcfolder "$STAGE" -ov -format UDZO "dist/Foldy-$VERSION.dmg"

      - name: Notarize and staple the DMG
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "dist/Foldy-$VERSION.dmg"
          xcrun notarytool submit "dist/Foldy-$VERSION.dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple "dist/Foldy-$VERSION.dmg"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # The site's download button links to releases/latest/download/Foldy.dmg, which
      # resolves only on an asset whose name never changes; copy the stapled DMG after
      # notarization so the copy carries the ticket too.
      - name: A stable DMG name for the site's download button
        run: command cp -f "dist/Foldy-${GITHUB_REF_NAME#v}.dmg" dist/Foldy.dmg

      - name: Checksums
        run: (cd dist && shasum -a 256 Foldy-*.zip Foldy*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$HAS_SIGNING" = "true" ]; then
            NOTES="Signed with a Developer ID and notarized. Needs macOS 14 and an Apple silicon MacBook with a lid angle sensor; the welcome tour asks for Screen Recording on the first launch."
          else
            NOTES="Ad-hoc signed, not notarized. macOS blocks the first launch: open Foldy once, then System Settings › Privacy & Security › **Open Anyway**. Or clear the quarantine flag first: \`xattr -dr com.apple.quarantine /Applications/Foldy.app\`. Needs macOS 14 and an Apple silicon MacBook with a lid angle sensor; the welcome tour asks for Screen Recording on the first launch."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Foldy $VERSION" \
            --generate-notes \
            --notes "$NOTES"

      # Sparkle: sign the zip with the EdDSA key, add it to the appcast and publish the
      # appcast to GitHub Pages, so installed copies see this release.
      - name: Update the appcast
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sSfL -o "$RUNNER_TEMP/Sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          WORK="$RUNNER_TEMP/appcast"
          mkdir -p "$WORK"
          cp "dist/Foldy-$VERSION.zip" "$WORK/"
          # Keep earlier items: start from the appcast on main.
          git fetch --depth 1 origin main
          git show origin/main:site/appcast.xml > "$WORK/appcast.xml" 2>/dev/null || rm -f "$WORK/appcast.xml"
          # A re-run of this tag replaces its own item rather than adding a second one.
          if [ -f "$WORK/appcast.xml" ]; then
            python3 - "$WORK/appcast.xml" "$VERSION" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          xml = open(path).read()
          xml = re.sub(r'\s*<item>(?:(?!</item>).)*?<sparkle:shortVersionString>' + re.escape(version) + r'</sparkle:shortVersionString>(?:(?!</item>).)*?</item>', '', xml, flags=re.S)
          open(path, 'w').write(xml)
          PY
          fi
          echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/alexey1312/foldy/releases/download/$GITHUB_REF_NAME/" \
            --link "https://foldy.proteinunit.dev/" \
            --maximum-versions 6 \
            "$WORK"
          cat "$WORK/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .   # drop the version stamp before leaving the tag
          git checkout -B main origin/main
          cp "$WORK/appcast.xml" site/appcast.xml
          git add site/appcast.xml
          git commit -m "Appcast: Foldy $VERSION"
          git push origin main
          # A push made with GITHUB_TOKEN starts no workflow on its own; ask Pages to deploy.
          gh workflow run pages.yml --ref main
